packages:
  - apps/*
  - packages/*

# pnpm 11默认阻止依赖执行安装脚本。Prisma需要这些官方构建脚本下载数据库引擎。
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - unrs-resolver
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@langchain/core@1.4.0'
  - '@langchain/openai@1.8.4'
